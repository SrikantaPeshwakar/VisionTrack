# ==============================================================================
# BoT-SORT Tracker Configuration for VisionTrack
# ==============================================================================
# Field names must match Ultralytics' expected tracker config exactly.
# Reference: ultralytics/cfg/trackers/botsort.yaml
#
# BoT-SORT combines:
#   - Kalman filter for motion prediction
#   - IoU-based association for positional matching
#   - Optional ReID appearance embeddings (disabled by default for speed)
#   - Global motion compensation (GMC) via sparse optical flow
# ==============================================================================

tracker_type: botsort   # tracker backend: {botsort, bytetrack}

# ------------------------------------------------------------------------------
# Detection Thresholds
# ------------------------------------------------------------------------------

# Minimum confidence for first-stage (high-quality) matching.
# Tracks are only initialised from detections above this threshold.
# Lower to keep more detections; raise for cleaner tracks.
# Range: [0.0, 1.0]
track_high_thresh: 0.25

# Minimum confidence for second-stage (low-score) recovery matching.
# Catches partially occluded or distant persons.
# Range: [0.0, track_high_thresh)
track_low_thresh: 0.1

# Minimum confidence to start a brand-new track.
# Higher reduces false/spurious tracks.
# Range: [0.0, 1.0]
new_track_thresh: 0.25

# ------------------------------------------------------------------------------
# Track Lifecycle
# ------------------------------------------------------------------------------

# Frames to keep a lost track alive during occlusion before deletion.
# Higher → handles longer occlusions but risks more ID switches.
# Lower  → faster cleanup but more IDs lost on brief occlusions.
# Recommended: 20–60 for dense crowd scenes.
track_buffer: 30

# ------------------------------------------------------------------------------
# Association
# ------------------------------------------------------------------------------

# Similarity threshold for IoU/cost-based association.
# Tune in tandem with detector confidence quality.
# Range: [0.0, 1.0]
match_thresh: 0.8

# Fuse detection score with motion/IoU for matching.
# True stabilises tracks from weak detections.
fuse_score: True

# ------------------------------------------------------------------------------
# Global Motion Compensation (GMC)
# ------------------------------------------------------------------------------

# Algorithm to compensate for camera motion between frames.
# Options:
#   sparseOptFlow  — sparse optical flow (fast, good for handheld cameras)
#   orb            — ORB feature matching (slower, more accurate)
#   sift           — SIFT feature matching (slowest, most robust)
#   ecc            — enhanced correlation coefficient
#   none           — disable GMC (use for fully static cameras)
gmc_method: sparseOptFlow

# ------------------------------------------------------------------------------
# ReID (Appearance Embeddings)
# ------------------------------------------------------------------------------

# Enable ReID model for appearance-based re-identification.
# Disabled by default — requires an additional embedding model download
# and significant extra compute. Enable for scenes with many occlusions.
with_reid: False

# Minimum IoU proximity to consider tracks for ReID matching.
# Range: [0.0, 1.0]
proximity_thresh: 0.5

# Minimum cosine similarity for appearance-based re-association.
# Raise to avoid identity swaps; lower to recover more occluded tracks.
# Range: [0.0, 1.0]
appearance_thresh: 0.8

# ReID model name or path.
# "auto" uses detector features when available (no extra download needed).
model: auto
